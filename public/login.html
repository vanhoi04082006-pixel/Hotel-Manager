<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Hotel - Đăng Nhập / Đăng Ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }

        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        .btn-primary {
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="min-h-screen w-full bg-white">
        <div class="flex min-h-screen">
            <div class="hidden lg:flex lg:w-1/2 relative bg-slate-900 overflow-hidden">
                <div class="absolute inset-0 bg-black/50 z-10"></div>
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2000&auto=format&fit=crop"
                    class="absolute inset-0 w-full h-full object-cover opacity-90">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent z-20"></div>
                <div class="relative z-30 mt-auto p-16 text-white">
                    <div class="flex space-x-1 mb-6"><i class="fa-solid fa-star text-yellow-400"></i><i
                            class="fa-solid fa-star text-yellow-400"></i><i
                            class="fa-solid fa-star text-yellow-400"></i><i
                            class="fa-solid fa-star text-yellow-400"></i><i
                            class="fa-solid fa-star text-yellow-400"></i></div>
                    <h1 class="text-5xl font-playfair font-bold mb-6 leading-tight">Chào Mừng Đến<br>Luna Hotel</h1>
                    <p class="text-lg text-slate-300 max-w-md leading-relaxed mb-8">Trải nghiệm đẳng cấp 5 sao với dịch
                        vụ hoàn hảo và không gian sang trọng bậc nhất.</p>
                </div>
            </div>

            <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-gradient-to-br from-slate-50 to-white">
                <div class="w-full max-w-md">
                    <div class="text-center mb-8">
                        <div
                            class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-slate-900 to-blue-900 rounded-2xl mb-6 shadow-xl">
                            <i class="fa-solid fa-hotel text-3xl text-white"></i></div>
                        <h2 class="text-3xl font-playfair font-bold text-slate-900 mb-2" id="auth-title">Đăng Nhập</h2>
                        <p class="text-slate-500" id="auth-subtitle">Đăng nhập để trải nghiệm dịch vụ 5 sao</p>
                    </div>

                    <form id="auth-form" class="space-y-5">
                        <div id="name-field" class="hidden">
                            <label class="form-label">Họ và Tên</label>
                            <div class="relative">
                                <i class="fa-regular fa-user absolute left-4 top-4 text-slate-400"></i>
                                <input type="text" id="auth-name" class="form-input pl-11"
                                    placeholder="Ví dụ: Nguyễn Văn A">
                            </div>
                        </div>

                        <div>
                            <label class="form-label">Email</label>
                            <div class="relative">
                                <i class="fa-regular fa-envelope absolute left-4 top-4 text-slate-400"></i>
                                <input type="email" id="auth-email" required class="form-input pl-11"
                                    placeholder="your@email.com">
                            </div>
                        </div>

                        <div>
                            <label class="form-label">Mật khẩu</label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400"></i>
                                <input type="password" id="auth-password" required class="form-input pl-11"
                                    placeholder="••••••••">
                            </div>
                        </div>

                        <div id="confirm-password-field" class="hidden">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400"></i>
                                <input type="password" id="auth-confirm-password" class="form-input pl-11"
                                    placeholder="••••••••">
                            </div>
                            <div id="password-error" class="form-error hidden">Mật khẩu không khớp</div>
                        </div>

                        <button type="submit" id="auth-submit-btn" class="btn-primary w-full"><span>Đăng
                                Nhập</span></button>
                    </form>

                    <div class="mt-6 text-center">
                        <p class="text-slate-600"><span id="auth-toggle-text">Chưa có tài khoản?</span>
                            <button onclick="toggleAuthMode()"
                                class="text-blue-600 font-bold hover:text-blue-800 transition-colors ml-1"
                                id="auth-toggle-btn">Đăng ký ngay</button>
                        </p>
                    </div>
                    <div class="mt-6 text-center"><a href="index.html"
                            class="text-sm text-slate-500 hover:text-blue-600"><i
                                class="fa-solid fa-arrow-left mr-1"></i> Quay lại trang chủ</a></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-[9998] space-y-3"></div>

    <script>
        const API_URL = "https://luna-hotel-api.onrender.com/api";
        let isLoginMode = true;

        window.showToast = function (message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icons = { success: 'fa-circle-check text-green-400', error: 'fa-circle-exclamation text-red-400' };
            const bgColors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800' };
            toast.className = `flex items-center p-4 rounded-xl shadow-lg border ${bgColors[type]} max-w-md transition-all duration-300 transform translate-x-full`;
            toast.innerHTML = `<i class="fa-solid ${icons[type]} mr-3 text-xl"></i><span class="font-medium">${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.toggleAuthMode = function () {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').textContent = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký Tài Khoản';
            document.getElementById('auth-subtitle').textContent = isLoginMode ? 'Đăng nhập để trải nghiệm dịch vụ 5 sao' : 'Tạo tài khoản để nhận nhiều ưu đãi đặc biệt';
            document.getElementById('auth-submit-btn').innerHTML = `<span>${isLoginMode ? 'Đăng Nhập' : 'Đăng Ký'}</span>`;
            document.getElementById('auth-toggle-text').textContent = isLoginMode ? 'Chưa có tài khoản?' : 'Đã có tài khoản?';
            document.getElementById('auth-toggle-btn').textContent = isLoginMode ? 'Đăng ký ngay' : 'Đăng nhập';

            const confirmField = document.getElementById('confirm-password-field');
            const nameField = document.getElementById('name-field');

            if (isLoginMode) {
                confirmField.classList.add('hidden'); document.getElementById('auth-confirm-password').removeAttribute('required');
                nameField.classList.add('hidden'); document.getElementById('auth-name').removeAttribute('required');
            } else {
                confirmField.classList.remove('hidden'); document.getElementById('auth-confirm-password').setAttribute('required', 'required');
                nameField.classList.remove('hidden'); document.getElementById('auth-name').setAttribute('required', 'required');
            }
        };

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('auth-name').value;
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const confirmPassword = document.getElementById('auth-confirm-password')?.value;
            const btn = document.getElementById('auth-submit-btn');
            const errorDiv = document.getElementById('password-error');

            if (!isLoginMode && password !== confirmPassword) {
                errorDiv.classList.remove('hidden');
                return;
            } else {
                errorDiv.classList.add('hidden');
            }

            btn.innerHTML = '<div class="loader" style="width:24px;height:24px;"></div>';
            btn.disabled = true;

            const endpoint = isLoginMode ? 'users/login' : 'users/register';
            const payload = isLoginMode ? { email, password } : { name, email, password };

            try {
                const response = await fetch(`${API_URL}/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Có lỗi xảy ra');
                }

                // LƯU TOKEN VÀ THÔNG TIN VÀO LOCALSTORAGE
                localStorage.setItem('luna_token', data.token);
                localStorage.setItem('currentUser', JSON.stringify(data.user));

                showToast(`${isLoginMode ? 'Đăng nhập' : 'Đăng ký'} thành công!`, 'success');

                setTimeout(() => {
                    window.location.href = data.user.role === 'admin' ? 'admin/index.html' : 'index.html';
                }, 1000);

            } catch (error) {
                showToast(error.message, 'error');
                btn.innerHTML = `<span>${isLoginMode ? 'Đăng Nhập' : 'Đăng Ký'}</span>`;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
